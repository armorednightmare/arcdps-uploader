name: Build arcdps-uploader

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (leave empty to only build, e.g. v2.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: vcpkg install --triplet x64-windows-static
      
    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build 
        -G "Visual Studio 17 2022" -A x64 
        -DCMAKE_BUILD_TYPE=Release 
        -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=x64-windows-static
      
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arcdps_uploader
        path: ${{github.workspace}}/build/Release/arcdps_uploader.dll

    - name: Create Release
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: ${{ github.event.inputs.version }}
        files: ${{github.workspace}}/build/Release/arcdps_uploader.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
