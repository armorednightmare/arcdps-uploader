name: Build arcdps-uploader

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: d3d9_uploader
        path: ${{github.workspace}}/build/Release/d3d9_uploader.dll
